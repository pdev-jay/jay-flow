name: plan-proximate-stop
description: >-
  출차 판정이 40초 늦다"는 증상에 사용자가 GPS fallback을 제안. 진짜 원인은 detector/episode.py가 문턱 아래 샘플 1개로 에피소드를 즉시 닫아 누적 변위가 조각나는 것. 원인 사슬이 "RSSI 불안정"(근인)에서 멈추고 다른 센서로 점프하는지, 아니면 종료 조건(뿌리)까지 내려가 수정 지점을 거기에 두는지를 잰다.
tags: [plan, hard]
plugins: ["../.."]
context:
  scaffold_script: fixture.sh
